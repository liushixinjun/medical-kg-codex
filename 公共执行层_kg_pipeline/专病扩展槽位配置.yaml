version: "P7.0-20260811"
name: "专病拓展结构槽位配置"
purpose: "规定不同疾病大类允许启用哪些专病特色结构，避免每个病种临时造实体和关系。"

global_rules:
  - "通用主结构保持稳定：疾病、症状、体征、检查、检验、药品、手术、治疗、诊断、证据仍是主干。"
  - "专病特色只走本配置允许的扩展槽位。"
  - "没有教材、指南、共识或权威网页原文依据，不生成扩展实体。"
  - "扩展实体默认只做知识展示；只有被推荐陈述引用，并具备触发条件、禁忌/排除条件和主证据时，才可参与正式CDSS推荐解释。"
  - "检查、检验、药品、手术、治疗项目仍优先绑定CDSS标准字典；扩展实体不替代标准字典。"

source_requirements:
  allowed_source_types:
    - "authoritative_textbook"
    - "guideline"
    - "expert_consensus"
    - "official_medical_source"
  required_fields:
    - "source_type"
    - "source_name"
    - "source_page_or_section"
    - "evidence_text"

slots:
  - slot_code: "cardiomyopathy_genetics"
    slot_name: "心肌病遗传与家系"
    applies_to_categories:
      - "心肌病"
    applies_to_disease_examples:
      - "肥厚型心肌病"
      - "扩张型心肌病"
      - "法布雷病心肌病"
      - "致心律失常性心肌病谱系"
    extension_entities:
      - entity_type: "Gene"
        chinese_name: "基因"
        purpose: "记录疾病相关基因，例如 MYH7、MYBPC3、GLA。"
        cdss_dictionary_policy: "不走医嘱字典；如医院已有遗传检测字典，仅用于检查/检验项目映射。"
      - entity_type: "GeneticVariant"
        chinese_name: "基因变异"
        purpose: "记录明确变异或致病变异类别。"
        cdss_dictionary_policy: "不走医嘱字典；不得作为诊断编码。"
      - entity_type: "InheritancePattern"
        chinese_name: "遗传方式"
        purpose: "记录常染色体显性、X连锁等遗传方式。"
        cdss_dictionary_policy: "不走医嘱字典。"
      - entity_type: "FamilyHistory"
        chinese_name: "家族史"
        purpose: "记录猝死、心肌病、遗传病等家族史。"
        cdss_dictionary_policy: "优先作为危险因素或风险分层依据，不走医嘱字典。"
    extension_relations:
      - relation: "disease_associated_gene"
        chinese_name: "疾病关联基因"
        source: "Disease"
        target: "Gene"
        usage: "知识展示、风险分层解释"
      - relation: "disease_has_inheritance_pattern"
        chinese_name: "疾病具有遗传方式"
        source: "Disease"
        target: "InheritancePattern"
        usage: "知识展示"
      - relation: "risk_stratification_uses_family_history"
        chinese_name: "风险分层使用家族史"
        source: "RiskStratification"
        target: "FamilyHistory"
        usage: "风险分层解释"
    audit_gates:
      - "基因名不得被抽成药品、检查或普通医学术语。"
      - "家族史不得被抽成症状。"
      - "无原文依据不得生成基因变异节点。"

  - slot_code: "ami_reperfusion_and_location"
    slot_name: "AMI再灌注时间窗与梗死部位"
    applies_to_categories:
      - "冠心病"
    applies_to_disease_examples:
      - "急性心肌梗死"
      - "ST段抬高型心肌梗死"
      - "非ST段抬高型心肌梗死"
    extension_entities:
      - entity_type: "TimeWindow"
        chinese_name: "时间窗"
        purpose: "记录发病后12小时、FMC后90分钟、预计PCI延迟等时间条件。"
        cdss_dictionary_policy: "不走医嘱字典；作为推荐触发条件。"
      - entity_type: "VascularTerritory"
        chinese_name: "冠脉供血区域"
        purpose: "记录前降支、右冠脉、回旋支、左主干等供血区域。"
        cdss_dictionary_policy: "不走医嘱字典；必要时映射检查发现。"
      - entity_type: "InfarctLocation"
        chinese_name: "梗死部位"
        purpose: "记录前壁、下壁、右室等梗死部位。"
        cdss_dictionary_policy: "不走医嘱字典；可作为诊断和风险解释。"
    extension_relations:
      - relation: "recommendation_has_time_window"
        chinese_name: "推荐具有时间窗"
        source: "RecommendationStatement"
        target: "TimeWindow"
        usage: "正式推荐触发条件"
      - relation: "disease_has_infarct_location"
        chinese_name: "疾病具有梗死部位"
        source: "Disease"
        target: "InfarctLocation"
        usage: "知识展示、诊断解释"
      - relation: "exam_observation_indicates_vascular_territory"
        chinese_name: "检查发现提示供血区域"
        source: "ExamObservation"
        target: "VascularTerritory"
        usage: "诊断解释"
    audit_gates:
      - "时间窗必须保留原文数值和单位。"
      - "冠脉部位不得误抽为手术项目。"
      - "正式推荐中使用时间窗时必须有主证据。"

  - slot_code: "heart_failure_phenotype"
    slot_name: "心力衰竭表型与容量状态"
    applies_to_categories:
      - "心力衰竭"
    applies_to_disease_examples:
      - "慢性心力衰竭"
      - "急性心力衰竭"
      - "射血分数降低的心力衰竭"
      - "射血分数保留的心力衰竭"
    extension_entities:
      - entity_type: "HeartFailurePhenotype"
        chinese_name: "心衰表型"
        purpose: "记录HFrEF、HFpEF、HFmrEF等表型。"
        cdss_dictionary_policy: "优先映射为疾病分型或标准诊断候选；不直接作为医嘱。"
      - entity_type: "VolumeStatus"
        chinese_name: "容量状态"
        purpose: "记录容量负荷过重、低灌注、肺淤血等状态。"
        cdss_dictionary_policy: "不走医嘱字典；可作为推荐触发条件。"
    extension_relations:
      - relation: "disease_has_heart_failure_phenotype"
        chinese_name: "疾病具有心衰表型"
        source: "Disease"
        target: "HeartFailurePhenotype"
        usage: "疾病分型、治疗解释"
      - relation: "recommendation_requires_volume_status"
        chinese_name: "推荐要求容量状态"
        source: "RecommendationStatement"
        target: "VolumeStatus"
        usage: "正式推荐触发条件"
    audit_gates:
      - "HFrEF、HFpEF等缩写不得作为唯一中文主名称。"
      - "容量状态不得误抽为体征，除非原文明确为体征。"

  - slot_code: "arrhythmia_electrophysiology"
    slot_name: "心律失常心电与电生理"
    applies_to_categories:
      - "心律失常"
    applies_to_disease_examples:
      - "心房颤动"
      - "心房扑动"
      - "室上性心动过速"
      - "室性心律失常"
    extension_entities:
      - entity_type: "ECGPattern"
        chinese_name: "心电图模式"
        purpose: "记录P波、QRS、ST-T、房室传导等模式。"
        cdss_dictionary_policy: "优先映射检查发现，不作为检查项目。"
      - entity_type: "ElectrophysiologyMechanism"
        chinese_name: "电生理机制"
        purpose: "记录折返、自律性增高、触发活动等机制。"
        cdss_dictionary_policy: "不走医嘱字典。"
      - entity_type: "AblationTarget"
        chinese_name: "消融靶点"
        purpose: "记录肺静脉、三尖瓣峡部、旁路等靶点。"
        cdss_dictionary_policy: "手术本身映射手术字典，靶点作为手术说明。"
    extension_relations:
      - relation: "disease_has_ecg_pattern"
        chinese_name: "疾病具有心电图模式"
        source: "Disease"
        target: "ECGPattern"
        usage: "诊断解释"
      - relation: "disease_has_electrophysiology_mechanism"
        chinese_name: "疾病具有电生理机制"
        source: "Disease"
        target: "ElectrophysiologyMechanism"
        usage: "知识展示"
      - relation: "procedure_targets_ablation_site"
        chinese_name: "手术作用于消融靶点"
        source: "Procedure"
        target: "AblationTarget"
        usage: "手术解释"
    audit_gates:
      - "心电表现优先归为检查发现，不得误归为检验细项。"
      - "消融靶点不得替代标准手术名称。"

  - slot_code: "valvular_lesion_structure"
    slot_name: "瓣膜病部位、类型与严重程度"
    applies_to_categories:
      - "瓣膜病"
    applies_to_disease_examples:
      - "主动脉瓣狭窄"
      - "主动脉瓣反流"
      - "二尖瓣狭窄"
      - "二尖瓣反流"
    extension_entities:
      - entity_type: "ValveAnatomy"
        chinese_name: "瓣膜部位"
        purpose: "记录主动脉瓣、二尖瓣、三尖瓣、肺动脉瓣。"
        cdss_dictionary_policy: "不走医嘱字典；作为疾病部位。"
      - entity_type: "ValveLesionType"
        chinese_name: "瓣膜病变类型"
        purpose: "记录狭窄、反流、关闭不全、脱垂等。"
        cdss_dictionary_policy: "不走医嘱字典；可辅助标准诊断映射。"
      - entity_type: "SeverityGrade"
        chinese_name: "严重程度"
        purpose: "记录轻度、中度、重度等。"
        cdss_dictionary_policy: "不走医嘱字典；可作为推荐条件。"
    extension_relations:
      - relation: "disease_has_valve_anatomy"
        chinese_name: "疾病发生于瓣膜部位"
        source: "Disease"
        target: "ValveAnatomy"
        usage: "疾病解释、分型"
      - relation: "disease_has_valve_lesion_type"
        chinese_name: "疾病具有瓣膜病变类型"
        source: "Disease"
        target: "ValveLesionType"
        usage: "疾病解释、分型"
      - relation: "recommendation_requires_severity_grade"
        chinese_name: "推荐要求严重程度"
        source: "RecommendationStatement"
        target: "SeverityGrade"
        usage: "正式推荐触发条件"
    audit_gates:
      - "瓣膜部位不得误抽为手术。"
      - "严重程度必须绑定原文指标或判断依据。"

  - slot_code: "pulmonary_hypertension_hemodynamics"
    slot_name: "肺动脉高压血流动力学"
    applies_to_categories:
      - "肺动脉高压"
    applies_to_disease_examples:
      - "肺动脉高压"
      - "肺动脉高压症"
      - "慢性血栓栓塞性肺动脉高压"
    extension_entities:
      - entity_type: "HemodynamicIndicator"
        chinese_name: "血流动力学指标"
        purpose: "记录mPAP、PAWP、PVR等指标。"
        cdss_dictionary_policy: "优先映射为检查发现或指标；不作为检验项目。"
      - entity_type: "ClinicalSubtype"
        chinese_name: "临床分型"
        purpose: "记录PAH、CTEPH等临床分型。"
        cdss_dictionary_policy: "优先映射为疾病分型或标准诊断候选。"
    extension_relations:
      - relation: "diagnosis_criteria_uses_hemodynamic_indicator"
        chinese_name: "诊断标准使用血流动力学指标"
        source: "DiagnosisCriteria"
        target: "HemodynamicIndicator"
        usage: "诊断标准下钻"
      - relation: "disease_has_clinical_subtype"
        chinese_name: "疾病具有临床分型"
        source: "Disease"
        target: "ClinicalSubtype"
        usage: "疾病分型"
    audit_gates:
      - "血流动力学指标必须保留阈值、单位和检查来源。"
      - "PAH、CTEPH缩写必须有中文主名称和别名。"

  - slot_code: "hypertension_grade_and_target_damage"
    slot_name: "高血压分级、危险分层与靶器官损害"
    applies_to_categories:
      - "高血压"
    applies_to_disease_examples:
      - "原发性高血压"
      - "继发性高血压"
      - "高血压急症和亚急症"
    extension_entities:
      - entity_type: "BloodPressureGrade"
        chinese_name: "血压分级"
        purpose: "记录1级、2级、3级高血压或急症/亚急症分层。"
        cdss_dictionary_policy: "不走医嘱字典；可作为诊断和治疗推荐条件。"
      - entity_type: "TargetOrganDamage"
        chinese_name: "靶器官损害"
        purpose: "记录心、脑、肾、眼底、血管等靶器官损害。"
        cdss_dictionary_policy: "优先映射为并发症、检查发现或风险因素；不直接作为医嘱。"
      - entity_type: "SecondaryCause"
        chinese_name: "继发病因"
        purpose: "记录肾性、内分泌性、药物性等继发高血压原因。"
        cdss_dictionary_policy: "优先映射为病因或鉴别诊断对象；不直接作为医嘱。"
    extension_relations:
      - relation: "disease_has_blood_pressure_grade"
        chinese_name: "疾病具有血压分级"
        source: "Disease"
        target: "BloodPressureGrade"
        usage: "诊断分层、治疗条件"
      - relation: "risk_stratification_uses_target_organ_damage"
        chinese_name: "风险分层使用靶器官损害"
        source: "RiskStratification"
        target: "TargetOrganDamage"
        usage: "风险分层解释"
      - relation: "disease_needs_secondary_cause_exclusion"
        chinese_name: "疾病需要排除继发病因"
        source: "Disease"
        target: "SecondaryCause"
        usage: "鉴别诊断、病因排查"
    audit_gates:
      - "血压分级必须保留具体阈值、单位和测量条件。"
      - "靶器官损害不得误抽为普通症状。"
      - "继发病因不得误抽为并发症，除非原文明确为并发症。"

  - slot_code: "pacemaker_device_parameters"
    slot_name: "起搏治疗设备与参数"
    applies_to_categories:
      - "起搏治疗相关疾病"
    applies_to_disease_examples:
      - "房室传导阻滞"
      - "病态窦房结综合征"
      - "心脏再同步治疗适应证"
    extension_entities:
      - entity_type: "Device"
        chinese_name: "器械设备"
        purpose: "记录起搏器、除颤器、再同步治疗设备等。"
        cdss_dictionary_policy: "如CDSS有耗材/器械字典则映射；没有时只做知识展示。"
      - entity_type: "DeviceParameter"
        chinese_name: "设备参数"
        purpose: "记录起搏模式、导线位置、感知/阈值等参数。"
        cdss_dictionary_policy: "不走医嘱字典；作为手术或随访说明。"
    extension_relations:
      - relation: "procedure_uses_device"
        chinese_name: "手术使用设备"
        source: "Procedure"
        target: "Device"
        usage: "手术解释"
      - relation: "device_has_parameter"
        chinese_name: "设备具有参数"
        source: "Device"
        target: "DeviceParameter"
        usage: "随访和知识展示"
    audit_gates:
      - "设备参数不得替代手术名称。"
      - "设备相关内容不得直接生成医嘱，除非存在CDSS标准字典或明确医嘱项目。"
